<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask to cut out a gap in the heart where the cross lies -->
    <mask id="cross-cutout">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <path
        d="M 54 34 L 54 66 M 38 50 L 70 50"
        stroke="black"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <!-- Blue Heart with Mask Applied -->
  <g mask="url(#cross-cutout)">
    <!-- Heart Left Symmetrical Loop (Primary Corporate Blue - #1E3A8A) -->
    <path
      d="M 50 24 C 28 4, 8 16, 8 46 C 8 72, 22 86, 38 76 C 48 70, 48 56, 40 48"
      stroke="#1E3A8A"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Heart Right Symmetrical Loop (Primary Corporate Blue - #1E3A8A) -->
    <path
      d="M 50 24 C 72 4, 92 16, 92 46 C 92 72, 62 76 C 52 70, 52 56, 60 48"
      stroke="#1E3A8A"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Green Medical Cross -->
  <path
    d="M 54 34 L 54 66 M 38 50 L 70 50"
    stroke="#15803D"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path to keep elements inside the capsule shape -->
    <clipPath id="pill-clip">
      <rect x="34" y="12" width="32" height="76" rx="16" />
    </clipPath>
  </defs>

  <!-- Rotated Group to match the tilted 3D capsule in the logo -->
  <g transform="rotate(-35 50 50)">
    <!-- Pill body with clip path applied -->
    <g clip-path="url(#pill-clip)">
      <!-- Top Half (Blue) -->
      <rect x="0" y="0" width="100" height="50" fill="#2b50bd" />
      <!-- Bottom Half (Pink/Red) -->
      <rect x="0" y="50" width="100" height="50" fill="#ff3366" />
    </g>

    <!-- White Heartbeat / Pulse Line through the center dividing line -->
    <path
      d="M 36 50 L 44 50 L 47 41 L 50 59 L 53 45 L 55 52 L 58 50 L 64 50"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
